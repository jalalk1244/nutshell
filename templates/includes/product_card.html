{% load static product_tags %}
<article class="shop-card">
  <a class="shop-card-image" href="{% url 'product_detail' product.id %}">
    {% if product.image %}
      <img src="{{ product|product_image_url }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
      <div class="image-placeholder">
        <span aria-hidden="true">
          ✳
        </span>
        <span>
          {{ product.name }}
        </span>
      </div>
    {% endif %}
    <span class="card-explore" aria-hidden="true">
      ↗
    </span>
  </a>
  <div class="shop-card-info">
    <p class="eyebrow">
      {{ product.category.name|default:'The collection' }}
    </p>
    <div class="card-title-row">
      <h3>
        <a href="{% url 'product_detail' product.id %}">
          {{ product.name }}
        </a>
      </h3>
      <span>
        ${{ product.price|floatformat:2 }}
      </span>
    </div>
    <a class="card-cta" href="{% url 'product_detail' product.id %}">
      Take a closer look
      <span aria-hidden="true">
        →
      </span>
    </a>
    {% if request.user.is_superuser %}
      <a class="text-link" href="{% url 'edit_product' product.id %}">
        Edit product
      </a>
    {% endif %}
  </div>
</article>
