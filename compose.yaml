name: nutshell

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: nutshell
      POSTGRES_USER: nutshell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutshell-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutshell -d nutshell"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    init: true
    ports:
      - "127.0.0.1:${NUTSHELL_PORT:-8001}:8000"
    environment:
      DEVELOPMENT: "1"
      SECRET_KEY: ${SECRET_KEY:-docker-local-development-only}
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://nutshell:${POSTGRES_PASSWORD:-nutshell-local-only}@db:5432/nutshell
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WH_SECRET: ${STRIPE_WH_SECRET:-}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6

volumes:
  postgres_data:
  media_data:
